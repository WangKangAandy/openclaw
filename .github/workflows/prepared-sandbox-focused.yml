name: Prepared sandbox focused proof
on:
  push:
    branches: [validation/prepared-sandbox-c9b74a6]
    paths: [.github/workflows/prepared-sandbox-focused.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: WangKangAandy/openclaw
          ref: c9b74a6e9a148207996054be8d8ce2cc06de59f1
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c9b74a6e9a148207996054be8d8ce2cc06de59f1
          test "$(git rev-parse HEAD^{tree})" = 45782131d0f23e9ea2046e9a3eb7486deecf108e
          test "$(git rev-parse HEAD^)" = ed2def8f795223f8aa49490aeb800b03be2b01c0
      - name: Frozen toolchain and dependencies
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.22.1
          semantic-checks: 'true'
          install-bun: 'true'
          frozen-lockfile: 'true'
          cache-mode: 'off'
      - name: Changed-file format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/run-format.mts --check src/agents/embedded-agent-runner/run/attempt.ts src/agents/embedded-agent-runner/run/attempt.spawn-workspace.context-engine.test.ts
      - name: Changed-file typed lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/agents/embedded-agent-runner/run/attempt.ts src/agents/embedded-agent-runner/run/attempt.spawn-workspace.context-engine.test.ts
      - name: Affected strict test graph
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/run-tsgo-core-test-shards.mjs --changed-paths-json '["src/agents/embedded-agent-runner/run/attempt.spawn-workspace.context-engine.test.ts"]'
      - name: Full affected attempt regression file
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/run-vitest.mjs run --config test/vitest/vitest.infra.config.ts src/agents/embedded-agent-runner/run/attempt.spawn-workspace.context-engine.test.ts --maxWorkers=1 --hookTimeout 360000
      - name: Regression line allocation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --import ./scripts/tsx.mjs scripts/check-test-lines-ratchet.mts --base ed2def8f795223f8aa49490aeb800b03be2b01c0
      - name: Tracked source unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD
